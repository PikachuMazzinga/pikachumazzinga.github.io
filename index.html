        /* STYLES */
        :root {
            /* Colors */
            --color-bg: #111116;
            --color-pattern: rgba(247, 122, 13, 0.09);
            
            --color-page: #191a20;
            --color-section: #1e2028;
            --color-card: #252731;
            --color-card-hover: #2c2f3b;
            
            --color-primary: #f77a0d;
            --color-text: #f4f4f5;
            --color-muted: #9295a5;
            --color-border: #30323d;
            
            /* Status colors */
            --color-released: #36c98f;
            --color-wip: #e9a23b;
            --color-winner: #f7c948;
            --color-discontinued: #ed7777;
            --color-experimental: #a78bfa;
            
            /* Typography */
            --font-main: 'Segoe UI', sans-serif;
            
            /* Layout */
            --page-width: 1150px;
            --page-padding: 45px;
            --section-spacing: 35px;
            --grid-gap: 20px;
            
            /* Appearance */
            --radius-page: 18px;
            --radius-section: 14px;
            --radius-card: 11px;
            --radius-tag: 5px;
            
            --card-image-height: 170px;
            
            --transition-speed: 0.25s;
        }
        
        /* =========================================
        RESET & GLOBAL
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            min-height: 100vh;
            background-color: var(--color-bg);
            
            /* Decorative background pattern */
            background-image:
            radial-gradient(
            var(--color-pattern) 1px,
            transparent 1px
            );
            
            background-size: 24px 24px;
            
            color: var(--color-text);
            font-family: var(--font-main);
            line-height: 1.6;
        }
        
        a {
            color: inherit;
            text-decoration: none;
        }
        
        /* =========================================
        MAIN PAGE CONTAINER
        ========================================= */
        .page {
            width: min(
            calc(100% - 50px),
            var(--page-width)
            );
            
            min-height: 100vh;
            margin: 35px auto;
            
            padding: 0 var(--page-padding);
            
            background: var(--color-page);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-page);
            
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.25);
        }
        
        /* =========================================
        HEADER
        ========================================= */
        .header {
            padding: 65px 0;
            border-bottom: 1px solid var(--color-border);
        }
        
        .header__profile {
            display: flex;
            align-items: center;
            gap: 35px;
        }
        
        .header__avatar {
            width: 155px;
            height: 155px;
            flex-shrink: 0;
            
            object-fit: cover;
            border-radius: 50%;
            
            border: 4px solid var(--color-section);
            outline: 2px solid var(--color-primary);
        }
        
        .header__eyebrow {
            color: var(--color-primary);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        
        .header__title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        
        .header__description {
            color: var(--color-muted);
            max-width: 550px;
            font-size: 1rem;
        }
        
        .header__socials {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 20px;
        }
        
        .header__socials a {
            color: var(--color-primary);
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity var(--transition-speed);
        }
        
        .header__socials a:hover {
            opacity: 0.65;
        }
        
        /* =========================================
        PROJECT SECTIONS
        ========================================= */
        .projects {
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: var(--section-spacing);
        }
        
        .projects-section {
            padding: 28px;
            background: var(--color-section);
            
            border: 1px solid var(--color-border);
            border-radius: var(--radius-section);
        }
        
        .section-header {
            margin-bottom: 25px;
        }
        
        .section-header__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 5px;
        }
        
        .section-header__title {
            font-size: 1.6rem;
            font-weight: 750;
        }
        
        .section-header__description {
            color: var(--color-muted);
            font-size: 0.9rem;
        }
        
        .section-header__count {
            color: var(--color-muted);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            
            border-radius: 20px;
            padding: 3px 11px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        /* =========================================
        PROJECT GRID
        ========================================= */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }
        
        /* =========================================
        PROJECT CARD
        ========================================= */
        .project-card {
            display: flex;
            flex-direction: column;
            
            min-width: 0;
            overflow: hidden;
            
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            
            transition:
            transform var(--transition-speed),
            background var(--transition-speed),
            border-color var(--transition-speed);
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            background: var(--color-card-hover);
            border-color: var(--color-primary);
        }
        
        /* Extra information shown when hovering or focusing a project card */
        .project-card {
            position: relative;
            isolation: isolate;
        }
        
        .project-card__tooltip {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            color: var(--color-text);
            font-size: 0.9rem;
            line-height: 1.6;
            background: linear-gradient(
            to top,
            rgba(17, 17, 22, 0.98),
            rgba(17, 17, 22, 0.88) 65%,
            rgba(17, 17, 22, 0.55)
            );
            opacity: 0;
            visibility: hidden;
            transition:
            opacity var(--transition-speed),
            visibility var(--transition-speed);
            pointer-events: none;
        }
        
        .project-card:hover .project-card__tooltip,
        .project-card:focus-visible .project-card__tooltip {
            opacity: 1;
            visibility: visible;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .project-card__tooltip {
                transition: none;
            }
        }
        
        .project-card__image {
            width: 100%;
            height: var(--card-image-height);
            
            display: block;
            object-fit: cover;
            
            background: var(--color-border);
        }
        
        .project-card__content {
            display: flex;
            flex-direction: column;
            flex: 1;
            
            padding: 16px;
        }
        
        .project-card__title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .project-card__description {
            color: var(--color-muted);
            font-size: 0.85rem;
        }
        
        .project-card__link {
            color: var(--color-primary);
            font-size: 0.85rem;
            font-weight: 600;
            
            margin-top: auto;
            padding-top: 15px;
        }
        
        /* =========================================
        PROJECT ROLE
        ========================================= */
        .project-card__role {
            margin-top: 10px;
            margin-bottom: 6px;
            padding: 10px 12px;
            background: rgba(247, 122, 13, 0.06);
            border-left: 2px solid var(--color-primary);
            border-radius: 0 var(--radius-tag) var(--radius-tag) 0;
        }
        
        .project-card__role-label {
            display: block;
            color: var(--color-primary);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        
        .project-card__role-description {
            color: var(--color-muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }
        
        .project-card__role-credit {
            display: block;
            margin-top: -4px;
            margin-bottom: 10px;
            color: var(--color-muted);
            font-size: 0.75rem;
            font-style: italic;
            line-height: 1.4;
        }
        
        /* =========================================
        PROJECT TAGS
        ========================================= */
        .project-card__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            
            margin-top: 13px;
        }
        
        .project-tag {
            display: inline-flex;
            align-items: center;
            
            padding: 3px 8px;
            
            border-radius: var(--radius-tag);
            
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.5;
            
            background: var(--color-border);
            color: var(--color-muted);
        }
        
        .project-tag--released {
            background: rgba(54, 201, 143, 0.12);
            color: var(--color-released);
        }
        
        .project-tag--wip {
            background: rgba(233, 162, 59, 0.12);
            color: var(--color-wip);
        }
        
        .project-tag--winner {
            background: rgba(247, 201, 72, 0.12);
            color: var(--color-winner);
        }
        
        .project-tag--discontinued {
            background: rgba(237, 119, 119, 0.12);
            color: var(--color-discontinued);
        }
        
        .project-tag--experimental {
            background: rgba(167, 139, 250, 0.12);
            color: var(--color-experimental);
        }
        
        /* =========================================
        FOOTER
        ========================================= */
        .footer {
            border-top: 1px solid var(--color-border);
            padding: 30px 0;
            
            text-align: center;
            color: var(--color-muted);
            font-size: 0.85rem;
        }
        
        /* =========================================
        RESPONSIVE DESIGN
        ========================================= */
        @media (max-width: 750px) {
            :root {
                --page-padding: 25px;
                --section-spacing: 25px;
            }
            
            .page {
                width: calc(100% - 30px);
                margin: 15px auto;
            }
            
            .header {
                padding: 45px 0;
            }
            
            .header__profile {
                gap: 25px;
            }
            
            .header__avatar {
                width: 120px;
                height: 120px;
            }
            
            .projects-section {
                padding: 22px;
            }
            
            .project-grid {
                grid-template-columns:
                repeat(2, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 520px) {
            :root {
                --page-padding: 16px;
                --card-image-height: 145px;
            }
            
            .page {
                width: calc(100% - 20px);
                margin: 10px auto;
                border-radius: 12px;
            }
            
            .header {
                padding: 40px 0;
            }
            
            .header__profile {
                flex-direction: column;
                text-align: center;
            }
            
            .header__avatar {
                width: 130px;
                height: 130px;
            }
            
            .header__socials {
                justify-content: center;
            }
            
            .projects {
                padding: 25px 0;
            }
            
            .projects-section {
                padding: 17px;
            }
            
            .section-header__title {
                font-size: 1.35rem;
            }
            
            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                role.className = "project-card__role";
                
                const roleLabel = document.createElement("span");
                roleLabel.className = "project-card__role-label";
                roleLabel.textContent = "My Role";
                
                const roleDescription = document.createElement("p");
                roleDescription.className = "project-card__role-description";
                roleDescription.textContent = project.role;
                
                role.append(roleLabel, roleDescription);
            }
            
            const tags = document.createElement("div");
            tags.className = "project-card__tags";
            
            (project.tags || []).forEach(tag => {
                
                const tagElement = document.createElement("span");
                
                tagElement.className =
                "project-tag project-tag--" + tag.type;
                
                tagElement.textContent = tag.label;
                
                tags.appendChild(tagElement);
            });
            
            const linkText = document.createElement("span");
            // linkText.className = "project-card__link";
            // linkText.textContent = "View Project ↗";
            
            content.append(projectTitle);
            
            if (roleCredit) content.append(roleCredit);
            
            content.append(projectDescription);
            
            if (role) content.append(role);
            
            content.append(
            tags,
            linkText
            );
            
            card.append(image, content);
            
            if (project.tooltip?.trim()) {
                const tooltip = document.createElement("div");
                tooltip.className = "project-card__tooltip";
                tooltip.textContent = project.tooltip;
                tooltip.setAttribute("role", "tooltip");
                card.appendChild(tooltip);
            }
            
            grid.appendChild(card);
            
        });
        
        sectionElement.append(header, grid);
        portfolio.appendChild(sectionElement);
        
    });
    
</script>

</body>
</html>
